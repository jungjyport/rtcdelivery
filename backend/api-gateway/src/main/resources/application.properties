# ============================================================
# API Gateway - Default Configuration
# Active Profile: dev
# ============================================================
spring.application.name=api-gateway
spring.profiles.active=dev

# Server
server.port=8080

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# Gateway Routes
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

# Food Catalog Service Route
spring.cloud.gateway.routes[0].id=food-catalog-service
spring.cloud.gateway.routes[0].uri=lb://food-catalog-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/foods/**,/api/v1/categories/**,/api/v1/restaurants/**

# Member Auth Service Route
spring.cloud.gateway.routes[1].id=member-auth-service
spring.cloud.gateway.routes[1].uri=lb://member-auth-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/auth/**,/api/v1/members/**

# Order Service Route
spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=lb://order-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/orders/**,/api/v1/delivery/**

# Payment Service Route
spring.cloud.gateway.routes[3].id=payment-service
spring.cloud.gateway.routes[3].uri=lb://payment-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/v1/payments/**

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# JWT
jwt.secret=rtcdelivery-dev-secret-key-must-be-at-least-256-bits-long-for-hs256
jwt.expiration=86400000

# Actuator
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.show-details=always

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,DELETE,PATCH,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true

# Logging
logging.level.root=INFO
logging.level.com.rtcdelivery=DEBUG
logging.level.org.springframework.cloud.gateway=DEBUG
