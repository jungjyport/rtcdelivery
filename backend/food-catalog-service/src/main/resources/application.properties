# ============================================================
# Food Catalog Service - Default Configuration
# Active Profile: dev
# ============================================================
spring.application.name=food-catalog-service
spring.profiles.active=dev

# Server
server.port=8081

# Eureka Client
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# 개발용 시드 데이터 (data.sql)
# defer-datasource-initialization=true가 없으면 Hibernate가 테이블을 만들기 전에 data.sql이 실행된다.
# data.sql은 INSERT IGNORE로 작성되어 있어 재기동해도 중복 삽입되지 않는다.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# Pagination
# size 상한을 두지 않으면 ?size=100000 한 번으로 전체 테이블을 긁어갈 수 있다.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=10

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=food-catalog-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# File Upload
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Logging
logging.level.root=INFO
logging.level.com.rtcdelivery=DEBUG
logging.level.org.hibernate.SQL=DEBUG
