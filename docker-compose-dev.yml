# 로컬 개발용 Compose.
# MySQL 컨테이너는 두지 않는다. 호스트 PC의 MySQL을 remote DB로 사용한다.
# 백엔드 설정은 Compose environment가 아니라 application-dev.properties 가 담당한다.
#
# 선행:
#   1. 호스트 MySQL이 외부(또는 LAN) IP로 컨테이너에서 접속 가능해야 한다
#   2. JWT PEM 배치
#      - member-auth-service/src/main/resources/keys/jwt-private.pem
#      - member-auth-service 와 api-gateway 양쪽에 jwt-public.pem
#
# 인프라만 띄우기:
#   docker compose -f docker-compose-dev.yml up redis kafka zookeeper
#
# 전체:
#   docker compose -f docker-compose-dev.yml up --build

x-backend-build: &backend-build
  context: .
  dockerfile: docker/backend/Dockerfile

services:

  # ========================
  # Redis
  # ========================
  redis:
    image: redis:7-alpine
    container_name: rtc-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    networks:
      - rtcdelivery-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================
  # Zookeeper (Kafka dependency)
  # ========================
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: rtc-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - rtcdelivery-network

  # ========================
  # Kafka
  # ========================
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: rtc-kafka
    restart: unless-stopped
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - rtcdelivery-network

  # ========================
  # Discovery (Eureka)
  # ========================
  discovery-service:
    build:
      <<: *backend-build
      args:
        SERVICE_PATH: backend/discovery-service
    image: rtc-discovery-service:dev
    container_name: rtc-discovery-service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
    networks:
      - rtcdelivery-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ========================
  # API Gateway
  # ========================
  api-gateway:
    build:
      <<: *backend-build
      args:
        SERVICE_PATH: backend/api-gateway
    image: rtc-api-gateway:dev
    container_name: rtc-api-gateway
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
    volumes:
      - ./backend/api-gateway/src/main/resources/keys:/keys:ro
    networks:
      - rtcdelivery-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ========================
  # Food Catalog Service
  # ========================
  food-catalog-service:
    build:
      <<: *backend-build
      args:
        SERVICE_PATH: backend/food-catalog-service
    image: rtc-food-catalog-service:dev
    container_name: rtc-food-catalog-service
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
    networks:
      - rtcdelivery-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 50s

  # ========================
  # Member Auth Service
  # ========================
  member-auth-service:
    build:
      <<: *backend-build
      args:
        SERVICE_PATH: backend/member-auth-service
    image: rtc-member-auth-service:dev
    container_name: rtc-member-auth-service
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
    volumes:
      - ./backend/member-auth-service/src/main/resources/keys:/keys:ro
    networks:
      - rtcdelivery-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 50s

  # ========================
  # Order Service
  # ========================
  order-service:
    build:
      <<: *backend-build
      args:
        SERVICE_PATH: backend/order-service
    image: rtc-order-service:dev
    container_name: rtc-order-service
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
    networks:
      - rtcdelivery-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 50s

  # ========================
  # Payment Service
  # ========================
  payment-service:
    build:
      <<: *backend-build
      args:
        SERVICE_PATH: backend/payment-service
    image: rtc-payment-service:dev
    container_name: rtc-payment-service
    restart: unless-stopped
    depends_on:
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      TZ: Asia/Seoul
    networks:
      - rtcdelivery-network
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 50s

  # ========================
  # Frontend (Nuxt 4)
  # ========================
  nuxt-app:
    build:
      context: .
      dockerfile: docker/frontend/Dockerfile.dev
    image: rtc-nuxt-app:dev
    container_name: rtc-nuxt-app
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:8080/api/v1
      HOST: "0.0.0.0"
      PORT: "3000"
    volumes:
      - ./frontend/nuxt-app:/app
      - nuxt-node-modules:/app/node_modules
      # 호스트 `npm run dev`가 만든 Windows 경로 .nuxt와 섞이면 Tailwind가
      # `tailwindConfig.blocklist`에서 터진다. 컨테이너 전용으로 분리한다.
      - nuxt-dot-nuxt:/app/.nuxt
    networks:
      - rtcdelivery-network

networks:
  rtcdelivery-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  nuxt-node-modules:
    driver: local
  nuxt-dot-nuxt:
    driver: local
